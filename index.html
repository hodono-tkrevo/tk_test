<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BASE Opening Animation Preview</title>
    <meta name="description" content="BASE opening animation preview patterns" />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <main class="stage" aria-label="BASE オープニングアニメーションプレビュー">
      <section class="pattern calm-wipe active" data-pattern="calm-wipe" data-final-delay="4100">
        <div class="opening opening-calm">
          <!-- <p class="eyebrow">BASE GROUP</p> -->
          <h1 class="message opening-keywords">
            <span>家づくり　不動産</span>
            <span>インテリア　キャリア</span>
          </h1>
          <p class="subcopy">全部、BASE GROUPで</p>
        </div>
        <div class="line-mask" aria-hidden="true"><span></span><span></span></div>
        <div class="final-wrap">
          <img src="./img/final-city.jpg" alt="" class="final-image" />
          <p class="final-text"><span>世界一、人が輝いている</span><span>住まいと暮らしの</span><span>総合コンサルティングカンパニー</span></p>
        </div>
      </section>

      <section class="pattern foundation" data-pattern="foundation" data-final-delay="4550">
        <div class="opening opening-foundation">
          <!-- <p class="eyebrow">BASE GROUP</p> -->
          <h1 class="foundation-copy"><span>全部、</span><span>BASE GROUPで</span></h1>
          <div class="business-list" aria-hidden="true">
            <span>家づくり</span>
            <span>不動産</span>
            <span>インテリア</span>
            <span>キャリア</span>
          </div>
        </div>
        <div class="line-mask foundation-line-mask" aria-hidden="true"><span></span><span></span></div>
        <div class="final-wrap final-dark">
          <img src="./img/final-city.jpg" alt="" class="final-image" />
          <p class="final-text"><span>世界一、人が輝いている</span><span>住まいと暮らしの</span><span>総合コンサルティングカンパニー</span></p>
        </div>
      </section>

      <section class="pattern quiet-grid" data-pattern="quiet-grid" data-final-delay="4300">
        <div class="quiet-panels" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="opening opening-grid">
          <!-- <p class="eyebrow">BASE GROUP</p> -->
          <h1 class="message compact opening-keywords">
            <span>家づくり　不動産</span>
            <span>インテリア　キャリア</span>
          </h1>
          <p class="subcopy">全部、BASE GROUPで</p>
        </div>
        <div class="final-wrap">
          <img src="./img/final-city.jpg" alt="" class="final-image" />
          <p class="final-text"><span>世界一、人が輝いている</span><span>住まいと暮らしの</span><span>総合コンサルティングカンパニー</span></p>
        </div>
      </section>

      

      <section class="pattern editorial-stack" data-pattern="editorial-stack" data-final-delay="4250">
        <div class="opening opening-editorial">
          <!-- <p class="eyebrow">BASE GROUP</p> -->
          <div class="editorial-shell">
            <div class="editorial-rail" aria-hidden="true"><span></span><span></span></div>
            <h1 class="editorial-copy">
              <span>家づくり</span>
              <span>不動産</span>
              <span>インテリア</span>
              <span>キャリア</span>
            </h1>
          </div>
          <p class="editorial-sub">全部、BASE GROUPで</p>
        </div>
        <div class="final-wrap final-blue">
          <img src="./img/final-city.jpg" alt="" class="final-image" />
          <p class="final-text"><span>世界一、人が輝いている</span><span>住まいと暮らしの</span><span>総合コンサルティングカンパニー</span></p>
        </div>
      </section>

    </main>

    <nav class="controls" aria-label="アニメーションパターン切り替え">
      <button class="active" data-target="calm-wipe">01 WIPE</button>
      <button data-target="foundation">02 FOUNDATION</button>
      <button data-target="quiet-grid">03 GRID</button>
      <button data-target="editorial-stack">04 EDITORIAL</button>
    </nav>

    <script src="js/main.js"></script>
  </body>
</html>
